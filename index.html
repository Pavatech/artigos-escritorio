<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesa &amp; Ela | Acessórios para sua mesa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="header-title">
        <h1>Mesa &amp; Ela</h1>
        <p>Acessórios para sua rotina de trabalho</p>
      </div>
    </div>
  </header>

  <nav aria-label="Navegação principal">
    <a href="#produtos">Início</a>
    <a href="#contato">Contato</a>
  </nav>

  <main>
    <div class="banner">
      Seu espaço de trabalho, com mais estilo, praticidade e personalidade
    </div>

    <div class="pesquisa-container" id="pesquisaContainer">
      <input type="search" id="campoBusca" placeholder="Buscar produto..." aria-label="Buscar produto">
      <button type="button" id="botaoBuscar" class="btn-buscar">Buscar</button>
    </div>

    <section class="produtos" id="produtos" aria-label="Catálogo de produtos"></section>
    <section class="detalhe-produto" id="detalheProduto" hidden></section>
  </main>

  <button class="carrinho-icon" id="botaoCarrinho" type="button" aria-label="Abrir carrinho">
    <i class="fas fa-shopping-cart" aria-hidden="true"></i>
    <span id="carrinhoQtd">0</span>
  </button>

  <div class="popup-carrinho" id="popupCarrinho" aria-label="Carrinho de compras">
    <h2>🛒 Carrinho</h2>
    <ul id="listaCarrinho"></ul>
    <div id="totalCarrinho" class="total">Total: R$ 0,00</div>
    <button class="btn-finalizar" id="finalizarCompra" type="button">Finalizar via WhatsApp</button>
  </div>

  <section id="contato" class="contato">
    <h2>Contato</h2>
    <p>📞 WhatsApp: (46) 99140-2714</p>
  </section>

  <script src="products.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
