<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja Católica - Artigos Religiosos</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <img src="img/logo.png" alt="Logo" class="logo"/>
      <div class="header-title"></div>
    </div>
  </header>

  <nav>
    <a href="#produtos" onclick="mostrarCatalogo()">Início</a>
    <a href="#contato">Contato</a>
  </nav>

  <div class="banner">
    Fortaleça sua fé com nossos artigos religiosos
  </div>

  <div class="pesquisa-container">
    <input type="text" id="campoBusca" placeholder="Buscar produto..." oninput="filtrarProdutos()">
    <button onclick="filtrarProdutos()" class="btn-buscar">Buscar</button>
  </div>

  <section class="produtos" id="produtos"></section>

  <section class="detalhe-produto" id="detalheProduto" hidden></section>

  <!-- Ícone flutuante do carrinho -->
  <button class="carrinho-icon" onclick="toggleCarrinho()">
    <i class="fas fa-shopping-cart"></i>
    <span id="carrinhoQtd">0</span>
  </button>

  <!-- Popup do carrinho -->
  <div class="popup-carrinho" id="popupCarrinho">
    <h2>🛒 Carrinho</h2>
    <ul id="listaCarrinho"></ul>
    <div id="totalCarrinho" style="margin: 10px 0; font-weight: bold;">Total: R$ 0,00</div>
    <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar via WhatsApp</button>
  </div>

  <section id="contato" style="padding: 40px; background-color: #eef2ea;">
    <h2 style="text-align: center;">Contato</h2>
    <p style="text-align: center;">📞 WhatsApp: (46) 99140-2714<br>📧 Email: lojacatolica@exemplo.com</p>
  </section>

  <script>
    const carrinho = [];

    const produtos = [
      {
        id: "terco", nome: "Terço", preco: 19.90,
        imagens: ["img/terço.png", "img/terco.jpeg"],
        descricao: "Um companheiro especial para os momentos de oração. Ideal para presentear e fortalecer a devoção no dia a dia.",
        relacionados: ["rosario", "escapulario", "medalha-sao-bento"]
      },
      {
        id: "crucifixo-parede", nome: "Crucifixo de Parede", preco: 39.90,
        imagens: ["img/crucifixo1.png"],
        descricao: "Uma peça de fé para decorar e abençoar sua casa. Uma opção especial para oratórios e ambientes de oração.",
        relacionados: ["imagem-nossa-senhora", "imagem-sao-francisco", "velas"]
      },
      {
        id: "imagem-nossa-senhora", nome: "Imagem de Nossa Senhora", preco: 59.90,
        imagens: ["img/nossasenhora.png"],
        descricao: "Imagem religiosa de Nossa Senhora, indicada para compor seu altar, oratório ou espaço de oração.",
        relacionados: ["crucifixo-parede", "terco", "velas"]
      },
      {
        id: "biblia", nome: "Bíblia Sagrada", preco: 49.90,
        imagens: ["img/biblia.jpg"],
        descricao: "A Palavra de Deus para acompanhar sua caminhada de fé, suas orações e momentos de reflexão.",
        relacionados: ["terco", "crucifixo-parede", "escapulario"]
      },
      {
        id: "velas", nome: "Velas Abençoadas", preco: 14.90,
        imagens: ["img/velas.jpg"],
        descricao: "Para acompanhar suas orações e momentos de devoção. Uma presença acolhedora no seu espaço de fé.",
        relacionados: ["imagem-nossa-senhora", "terco", "crucifixo-parede"]
      },
      {
        id: "crucifixo-pequeno", nome: "Crucifixo Pequeno", preco: 29.90,
        imagens: ["img/colar.png"],
        descricao: "Um crucifixo pequeno para levar consigo e manter a fé sempre por perto.",
        relacionados: ["escapulario", "medalha-sao-bento", "chaveiro"]
      },
      {
        id: "medalha-sao-bento", nome: "Medalha de São Bento", preco: 24.90,
        imagens: ["img/medalhasbento.jpg"],
        descricao: "Um artigo de devoção a São Bento, ideal para quem deseja expressar sua fé ou presentear alguém especial.",
        relacionados: ["terco", "escapulario", "crucifixo-pequeno"]
      },
      {
        id: "imagem-sao-francisco", nome: "Imagem de São Francisco", preco: 69.90,
        imagens: ["img/sfrancisco.jpg"],
        descricao: "Imagem de São Francisco para seu altar, oratório ou ambiente de oração.",
        relacionados: ["imagem-nossa-senhora", "crucifixo-parede", "terco"]
      },
      {
        id: "escapulario", nome: "Escapulário", preco: 12.90,
        imagens: ["img/escapulario.jpg"],
        descricao: "Um artigo de devoção para acompanhar sua rotina e expressar sua fé.",
        relacionados: ["terco", "medalha-sao-bento", "crucifixo-pequeno"]
      },
      {
        id: "rosario", nome: "Rosário", preco: 22.90,
        imagens: ["img/Rosario.jpg"],
        descricao: "Um rosário para acompanhar suas orações e momentos de contemplação.",
        relacionados: ["terco", "biblia", "escapulario"]
      },
      {
        id: "chaveiro", nome: "Chaveiro", preco: 11.90,
        imagens: ["img/chaveiro.jpg"],
        descricao: "Um pequeno artigo religioso para levar consigo no dia a dia ou presentear.",
        relacionados: ["crucifixo-pequeno", "medalha-sao-bento", "escapulario"]
      },
    ];

    function formatarPreco(preco) {
      return preco.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function carregarProdutos(lista = produtos) {
      const container = document.getElementById('produtos');
      container.innerHTML = '';
      lista.forEach((prod) => {
        const div = document.createElement('div');
        div.className = 'produto';
        div.innerHTML = `
          <button class="produto-link" type="button" aria-label="Ver detalhes de ${prod.nome}">
            <img src="${prod.imagens[0]}" alt="${prod.nome}">
            <h3>${prod.nome}</h3>
          </button>
          <p>${formatarPreco(prod.preco)}</p>
          <button class="btn-detalhes" type="button">Ver detalhes</button>
          <button class="btn-comprar" onclick="adicionarAoCarrinho('${prod.nome}', ${prod.preco})">Adicionar ao carrinho</button>
        `;
        div.querySelector('.produto-link').addEventListener('click', () => abrirProduto(prod.id));
        div.querySelector('.btn-detalhes').addEventListener('click', () => abrirProduto(prod.id));
        container.appendChild(div);
      });
    }

    function abrirProduto(id, atualizarEndereco = true) {
      const produto = produtos.find((item) => item.id === id);
      if (!produto) {
        return;
      }

      const catalogo = document.getElementById('produtos');
      const detalhe = document.getElementById('detalheProduto');
      const relacionados = produto.relacionados
        .map((relacionadoId) => produtos.find((item) => item.id === relacionadoId))
        .filter(Boolean);

      detalhe.innerHTML = `
        <button class="btn-voltar" type="button">← Voltar aos produtos</button>
        <div class="detalhe-conteudo">
          <div class="galeria-produto">
            <img class="foto-principal" src="${produto.imagens[0]}" alt="${produto.nome}">
            <div class="miniaturas" aria-label="Outras fotos de ${produto.nome}">
              ${produto.imagens.map((imagem, indice) => `
                <button class="miniatura${indice === 0 ? ' selecionada' : ''}" type="button" data-imagem="${indice}" aria-label="Ver foto ${indice + 1} de ${produto.nome}">
                  <img src="${imagem}" alt="">
                </button>
              `).join('')}
            </div>
          </div>
          <div class="informacoes-produto">
            <p class="etiqueta-produto">ARTIGO RELIGIOSO</p>
            <h1>${produto.nome}</h1>
            <p class="preco-detalhe">${formatarPreco(produto.preco)}</p>
            <p class="descricao-produto">${produto.descricao}</p>
            <button class="btn-comprar" type="button">Adicionar ao carrinho</button>
          </div>
        </div>
        <section class="relacionados-produto">
          <h2>Você também pode gostar</h2>
          <div class="produtos relacionados-lista"></div>
        </section>
      `;

      detalhe.querySelector('.btn-voltar').addEventListener('click', mostrarCatalogo);
      detalhe.querySelector('.informacoes-produto .btn-comprar')
        .addEventListener('click', () => adicionarAoCarrinho(produto.nome, produto.preco));
      detalhe.querySelectorAll('.miniatura').forEach((miniatura) => {
        miniatura.addEventListener('click', () => {
          detalhe.querySelector('.foto-principal').src = produto.imagens[miniatura.dataset.imagem];
          detalhe.querySelectorAll('.miniatura').forEach((item) => item.classList.remove('selecionada'));
          miniatura.classList.add('selecionada');
        });
      });

      const listaRelacionados = detalhe.querySelector('.relacionados-lista');
      relacionados.forEach((relacionado) => {
        const card = document.createElement('div');
        card.className = 'produto';
        card.innerHTML = `
          <button class="produto-link" type="button" aria-label="Ver detalhes de ${relacionado.nome}">
            <img src="${relacionado.imagens[0]}" alt="${relacionado.nome}">
            <h3>${relacionado.nome}</h3>
          </button>
          <p>${formatarPreco(relacionado.preco)}</p>
          <button class="btn-detalhes" type="button">Ver detalhes</button>
        `;
        card.querySelector('.produto-link').addEventListener('click', () => abrirProduto(relacionado.id));
        card.querySelector('.btn-detalhes').addEventListener('click', () => abrirProduto(relacionado.id));
        listaRelacionados.appendChild(card);
      });

      catalogo.hidden = true;
      detalhe.hidden = false;
      if (atualizarEndereco) {
        window.location.hash = `produto-${produto.id}`;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function mostrarCatalogo() {
      document.getElementById('detalheProduto').hidden = true;
      document.getElementById('produtos').hidden = false;
      window.location.hash = 'produtos';
    }

    window.addEventListener('hashchange', () => {
      const idProduto = window.location.hash.slice(1).replace(/^produto-/, '');
      if (window.location.hash.startsWith('#produto-')) {
        abrirProduto(idProduto, false);
      } else if (!document.getElementById('detalheProduto').hidden) {
        document.getElementById('detalheProduto').hidden = true;
        document.getElementById('produtos').hidden = false;
      }
    });

    function adicionarAoCarrinho(nome, preco) {
      carrinho.push({ nome, preco });
      atualizarCarrinho();
    }

    function removerDoCarrinho(index) {
      carrinho.splice(index, 1);
      atualizarCarrinho();
    }

    function atualizarCarrinho() {
      const lista = document.getElementById("listaCarrinho");
      const totalSpan = document.getElementById("totalCarrinho");
      const contador = document.getElementById("carrinhoQtd");
      lista.innerHTML = "";

      let total = 0;
      carrinho.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `${item.nome} - R$ ${item.preco.toFixed(2)} <button class='remover' onclick='removerDoCarrinho(${index})'>x</button>`;
        lista.appendChild(li);
        total += item.preco;
      });

      totalSpan.textContent = `Total: R$ ${total.toFixed(2)}`;
      contador.textContent = carrinho.length;
    }

    function toggleCarrinho() {
      const popup = document.getElementById("popupCarrinho");
      popup.style.display = popup.style.display === "flex" ? "none" : "flex";
    }

    function finalizarCompra() {
      if (carrinho.length === 0) {
        alert("Seu carrinho está vazio.");
        return;
      }
      const mensagem = `Olá, gostaria de fazer o seguinte pedido:\n\n${carrinho.map(i => `• ${i.nome} - R$ ${i.preco.toFixed(2)}`).join('\n')}`;
      const numero = "5511999999999"; // Altere para o número real
      const url = `https://wa.me/${5546991402714}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }

    function filtrarProdutos() {
      const termo = document.getElementById('campoBusca').value.toLowerCase();
      const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(termo));
      carregarProdutos(filtrados);
    }

    carregarProdutos();
    if (window.location.hash.startsWith('#produto-')) {
      abrirProduto(window.location.hash.slice('#produto-'.length), false);
    }
  </script>
</body>
</html>
